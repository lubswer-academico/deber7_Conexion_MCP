plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.usagestats'
version = '1.0.0'

android {
  namespace "expo.modules.usagestats"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  if (findProject(':expo-modules-core') != null) {
    implementation project(':expo-modules-core')
  } else {
    implementation 'expo.modules:expo-modules-core:+'
  }
}
